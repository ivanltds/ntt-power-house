<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Entrar — Radar</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/tema.js"></script>
</head>
<body class="login-page">
  <main class="login-box">
    <div class="login-brand">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg>
      <h1>Radar</h1>
      <p class="muted">Propostas &amp; cases · protótipo com dados fictícios</p>
    </div>
    <form id="login" novalidate>
      <label>Usuário<input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label>Senha<input id="senha" name="senha" type="password" autocomplete="current-password" required></label>
      <p id="erro" class="login-erro" role="alert" hidden></p>
      <button class="btn primary block" type="submit">Entrar</button>
    </form>
  </main>
  <footer class="made-by login"><span>Criado e desenvolvido por</span><span class="impact-logo"><img class="logo-light" src="/img/impactai-claro.png" alt="ImpactAI" width="81" height="22"><img class="logo-dark" src="/img/impactai-escuro.png" alt="ImpactAI" width="81" height="22"></span></footer>
  <script>
    const form = document.getElementById('login');
    const erro = document.getElementById('erro');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button');
      const usuario = form.usuario.value.trim();
      const senha = form.senha.value;
      if (!usuario || !senha) { erro.textContent = 'Preencha usuário e senha.'; erro.hidden = false; return; }
      btn.disabled = true; btn.textContent = 'Entrando…'; erro.hidden = true;
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario, senha }) });
        if (res.ok) return location.replace(new URLSearchParams(location.search).get('volta') === 'status' ? '/status' : '/');
        erro.textContent = (await res.json().catch(() => ({}))).erro ?? 'Não foi possível entrar.';
      } catch {
        erro.textContent = 'Sem conexão com o servidor. Tente de novo.';
      }
      erro.hidden = false; btn.disabled = false; btn.textContent = 'Entrar';
      form.senha.select();
    });
  </script>
</body>
</html>
