<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Tickets — Radar</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/tema.js"></script>
</head>
<body class="status-page tickets-page">
  <header class="topbar">
    <div class="brand"><i data-icon="radar" data-size="22"></i><span>Radar · Tickets</span><span class="versao" id="tk-versao"></span></div>
    <div class="st-head-acoes">
      <a class="btn sm" href="/status"><i data-icon="chart" data-size="14"></i>Status</a>
      <a class="btn sm primary" href="/">Abrir o Radar</a>
    </div>
  </header>
  <main class="st-main tk-main">
    <h1 class="tk-h1">Tickets e feedbacks</h1>
    <p class="muted">Problemas, dúvidas e sugestões de todas as versões. Priorize, edite, anexe imagens e mova pela situação. Cada mudança fica no histórico do ticket com o seu nome.</p>
    <div id="tk-root"><p class="muted">Carregando…</p></div>
  </main>
  <script type="module">
    import { montarTickets } from '/tickets-ui.js';
    import { hydrateIcons } from '/icons.js';
    import { api } from '/common.js';
    hydrateIcons();
    const visao = new URLSearchParams(location.search).get('visao') === 'kanban' ? 'kanban' : 'lista';
    api('/api/qualidade').then((q) => { document.getElementById('tk-versao').textContent = q.versao; });
    montarTickets(document.getElementById('tk-root'), { visao }).catch((err) => {
      document.getElementById('tk-root').innerHTML = `<p class="alert error">Não foi possível carregar os tickets: ${String(err.message).replace(/</g, '&lt;')}</p>`;
    });
  </script>
</body>
</html>
